{% extends "base.html" %}
{% block title %}Create an account{% endblock %}

{% block content %}
<section class="page-header">
  <div class="container">
    <p class="eyebrow eyebrow--light">Account</p>
    <h1>Create an account</h1>
    <p class="lead">Swimmers and coaches get different tools, so choose the one that fits you.</p>
  </div>
</section>

<section class="section section--tight">
  <div class="container">
    <form class="card auth-card" method="post" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      {% include "_role_switch.html" %}

      <label>Email<input type="email" name="email" value="{{ email }}" autocomplete="email" required autofocus></label>
      <label>Password <span class="hint">At least 8 characters</span>
        <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
      <p class="auth-card__alt">Already have an account? <a href="{{ url_for('auth.login', role=role) }}">Log in</a></p>
    </form>
  </div>
</section>
{% endblock %}
